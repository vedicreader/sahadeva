[project]
name = "sahadeva"
version = "0.1.0"
description = "Sanskrit TTS trained on forced-aligned Vedic recitation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[project.scripts]
sd-fetch = "sd.fetch:main"
sd-build = "sd.data:build"
sd-train = "sd.train:run"
sd-eval  = "sd.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sd"]
